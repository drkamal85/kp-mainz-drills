name: Motion Snapshot

on:
  schedule:
    - cron: '0 3 * * *'      # nightly 03:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Motion snapshot
        env:
          MOTION_API_KEY: ${{ secrets.MOTION_API_KEY }}
        run: node tools/motion-snapshot.js
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add comms/motion-snapshot.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: motion snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
