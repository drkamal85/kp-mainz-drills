name: Deploy kp-progress Worker

# Auto-deploys the API/feeds Worker whenever anything under api/ changes on main
# (api/topics.json, api/themen.json, api/deck.json, progress-worker.js, wrangler.jsonc).
# One-time setup: add a repo secret CLOUDFLARE_API_TOKEN
#   (GitHub → Settings → Secrets and variables → Actions → New repository secret).
#   Token scope: "Edit Cloudflare Workers" (Account → Workers Scripts: Edit, plus Workers KV Storage: Edit).
# The account id lives in api/wrangler.jsonc, so no second secret is needed.

on:
  push:
    branches: [main]
    paths: ['api/**']
  workflow_dispatch:   # lets you trigger a deploy manually from the Actions tab

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy Worker
        working-directory: api
        run: npx --yes wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
